name: Beezio live Netlify smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public production health only
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://beezio.co/.netlify/functions/health"
          for attempt in $(seq 1 6); do
            health_code=$(curl -sS -o /tmp/health.out -w "%{http_code}" "$health_url" || true)
            echo "attempt=$attempt health=$health_code"
            if [ "$health_code" = "200" ]; then
              echo "Beezio production health endpoint is responding."
              exit 0
            fi
            sleep 15
          done
          echo "Beezio production health endpoint did not return HTTP 200."
          exit 1
