name: Beezio production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/project/package-lock.json

      - name: Install dependencies
        working-directory: project/project
        run: npm ci

      - name: Variant, account navigation, storefront and attribution safety tests
        working-directory: project/project
        run: npm test -- --maxWorkers=2 src/services/productService.variant.test.ts src/utils/accountRoles.test.ts src/utils/businessNavigation.test.ts src/utils/checkoutAttribution.test.ts src/utils/buyerPrice.test.ts src/utils/storefrontBuyerPrice.test.ts src/components/brand/BeezioBrand.test.tsx

      - name: Vite production build
        working-directory: project/project
        run: npm run build

      - name: Bundle Netlify functions
        working-directory: .
        run: npx --yes netlify-cli@latest functions:build --src project/project/netlify/functions --functions .netlify/functions-dist
