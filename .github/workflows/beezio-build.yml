name: Beezio production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: project/project/package-lock.json

      - name: Install dependencies
        working-directory: project/project
        run: npm ci

      - name: Exact variant safety test
        working-directory: project/project
        run: npm test -- src/services/productService.variant.test.ts

      - name: Vite production build
        working-directory: project/project
        run: npm run build

      - name: Netlify production bundle check
        working-directory: .
        run: npx --yes netlify-cli@latest build
