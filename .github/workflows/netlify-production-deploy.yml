name: Deploy Beezio to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beezio-production-deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: project/project

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/project/package-lock.json

      - name: Verify Netlify deployment token
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "NETLIFY_AUTH_TOKEN is not configured"; exit 1; }

      - name: Install app dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Discover Beezio Netlify site
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" 'https://api.netlify.com/api/v1/sites?per_page=100')"
          site_id="$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", c => body += c);
            process.stdin.on("end", () => {
              const sites = JSON.parse(body);
              const normalize = v => String(v || "").toLowerCase().replace(/^https?:\/\//, "").replace(/\/$/, "");
              const site = sites.find(s => [s.custom_domain, s.url, s.ssl_url, s.name].some(v => normalize(v) === "beezio.co" || normalize(v) === "beezio"));
              if (!site?.id) process.exit(2);
              process.stdout.write(site.id);
            });
          ')"
          test -n "$site_id" || { echo "Could not find the beezio.co Netlify site"; exit 1; }
          echo "NETLIFY_SITE_ID=$site_id" >> "$GITHUB_ENV"

      - name: Deploy the canonical Beezio application
        run: npx --yes netlify-cli@latest deploy --site "$NETLIFY_SITE_ID" --build --prod --context production --message "Beezio unified production $GITHUB_SHA"
