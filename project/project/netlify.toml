  status = 200
  force = true

[[redirects]]
  from = "/api/paypal/client-token"
  to = "/.netlify/functions/paypal-client-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/paypal/create-order"
  to = "/.netlify/functions/paypal-create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/paypal/capture-order"
  to = "/.netlify/functions/paypal-capture-order"
