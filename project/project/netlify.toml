# Existing API routes -> Netlify Functions
[[redirects]]
  from = "/api/checkout/create"
  to = "/.netlify/functions/checkout-create"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/account-status"
  to = "/.netlify/functions/stripe-account-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/create-embedded-account"
  to = "/.netlify/functions/stripe-create-embedded-account"
  status = 200
  force = true

[[redirects]]
  from = "/api/user-earnings"
  to = "/.netlify/functions/user-earnings"
  status = 200
  force = true

[[redirects]]
  from = "/api/signup/bootstrap"
  to = "/.netlify/functions/signup-bootstrap"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/recruit/resolve"
  to = "/.netlify/functions/public-recruit-resolve"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/store/resolve"
  to = "/.netlify/functions/public-store-resolve"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/store/get"
  to = "/.netlify/functions/public-store-get"
  status = 200
  force = true

# SPA fallback must remain last so API requests are never swallowed by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
