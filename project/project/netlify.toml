[build]
  # The actual Vite app (package.json) lives in ./project
  command = "npm run build"
  publish = "dist"
  # Netlify Functions used by the app live alongside the Vite project
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--production=false"

# CJ automation schedules are declared here because these functions use the
# legacy Netlify Handler signature. Inline `config.schedule` is only extracted
# reliably from the newer web-platform function signature.
[functions."cj-process-webhooks"]
  schedule = "* * * * *"

[functions."cj-process-pending"]
  schedule = "*/5 * * * *"

[functions."cj-seed-supplyline-plus"]
  schedule = "*/5 * * * *"

[functions."cj-sync-orders"]
  schedule = "*/15 * * * *"

[functions."cj-sync-webhook-subscriptions"]
  schedule = "@hourly"

# Cache control headers
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables should be set in the Netlify UI or via the Netlify CLI.
# DO NOT store secrets here in the repo.

# Force HTTPS
[[redirects]]
  from = "http://beezio.co/*"
  to = "https://beezio.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.beezio.co/*"
  to = "https://beezio.co/:splat"
  status = 301
  force = true

# Core health + public commerce API routes
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/marketplace/products"
  to = "/.netlify/functions/public-marketplace-products"
  status = 200
  force = true

# PayPal runtime + checkout routes
[[redirects]]
