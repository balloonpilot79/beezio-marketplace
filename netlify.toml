[build]
  base = "project/project"
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--production=false"

# IMPORTANT: No scheduled/background functions in the beta launch build.
# These jobs were running automatically even when the site was idle and were
# consuming Functions compute credits. Order/fulfillment functions remain
# available on demand through their normal endpoints.

# Redirect www to non-www
[[redirects]]
  from = "https://www.beezio.co/*"
  to = "https://beezio.co/:splat"
  status = 301
  force = true

# API routes (keep above SPA fallback)
[[redirects]]
  from = "/api/affiliate/link"
  to = "/.netlify/functions/affiliate-link"
  status = 200

[[redirects]]
  from = "/api/affiliate/enable"
  to = "/.netlify/functions/affiliate-enable"
  status = 200

[[redirects]]
  from = "/api/analytics/share_click"
  to = "/.netlify/functions/analytics-share-click"
  status = 200

[[redirects]]
  from = "/api/checkout/create"
  to = "/.netlify/functions/checkout-create"
  status = 200

[[redirects]]
  from = "/api/user-earnings"
  to = "/.netlify/functions/user-earnings"
  status = 200

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
